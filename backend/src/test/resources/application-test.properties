# CONFIGURAÇÕES DA BASE DE DADOS PARA TESTES (H2 - EM MEMÓRIA)
# Como somos adeptos de TDD, os nossos testes precisam de correr em milissegundos.
# A base de dados H2 é "virtual" (só existe na memória RAM enquanto os testes correm).
spring.datasource.driver-class-name=org.h2.Driver
# Esta URL cria uma base de dados na memória chamada 'testdb' em modo de compatibilidade PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# HIBERNATE PARA TESTES
# 'create-drop' é brutal para testes: 
# 1. Quando o teste arranca, o Hibernate cria as tabelas do zero.
# 2. Quando o teste acaba, ele destrói todas as tabelas, deixando a casa limpa para o próximo teste.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
