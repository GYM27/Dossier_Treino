# CONFIGURAÇÕES DO SERVIDOR
# A nossa API vai correr na porta 8080 (padrão do Spring Boot)
server.port=8080

# CONFIGURAÇÕES DA BASE DE DADOS (POSTGRESQL)
# O driver que ensina o Java a falar com o Postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# O endereço exato da nossa base de dados local
spring.datasource.url=jdbc:postgresql://localhost:5432/dossier_treinador
spring.datasource.username=postgres
spring.datasource.password=postgres

# CONFIGURAÇÕES DO HIBERNATE (ORM)
# 'update' diz ao Hibernate para criar/atualizar as tabelas no Postgres automaticamente 
# sempre que nós alteramos uma Entidade no Java. É fantástico para desenvolvimento rápido.
spring.jpa.hibernate.ddl-auto=update
# Pede ao Hibernate para imprimir no terminal todo o SQL que ele gera por trás dos panos
spring.jpa.show-sql=true
# Pede para formatar esse SQL de forma bonita (com quebras de linha e tabs)
spring.jpa.properties.hibernate.format_sql=true
# Informamos o Hibernate que estamos a usar o PostgreSQL, para ele gerar queries otimizadas
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# CONFIGURAÇÕES JWT
# A chave secreta (usada para assinar e verificar o token). DEVE TER PELO MENOS 256 BITS (32 caracteres).
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Tempo de expiração do token em milissegundos (ex: 86400000 = 1 dia)
application.security.jwt.expiration=86400000
# Flag para controlar se o cookie é Secure (false em dev, true em prod)
security.cookie.secure=false
